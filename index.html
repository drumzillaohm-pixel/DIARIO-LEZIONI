<title>Diario Lezioni Batteria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10151f;
    --panel: #171f30;
    --panel-2: #1f2a40;
    --ivory: #eef3f8;
    --muted: #90a0ba;
    --brass: #35d0c4;
    --brass-dark: #1f8f86;
    --amber: #ff9d5c;
    --amber-deep: #c56a34;
    --green: #3fcf8e;
    --green-deep: #1f7a58;
    --red: #ff6b6b;
    --red-deep: #a13d3d;
    --border: rgba(238,243,248,0.09);
    --danger-text: #ffd0d0;
  }
  *{box-sizing:border-box;}
  input, textarea, select{ font-style:normal !important; }
  body{
    margin:0;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 4px),
      radial-gradient(circle at 50% -10%, rgba(53,208,196,0.10) 0%, transparent 42%),
      radial-gradient(circle at 92% 4%, rgba(255,157,92,0.14) 0%, transparent 30%),
      radial-gradient(ellipse 900px 620px at 50% -12%, rgba(53,208,196,0.14), transparent 60%),
      radial-gradient(ellipse 700px 520px at 105% 100%, rgba(255,157,92,0.12), transparent 55%),
      linear-gradient(160deg, #141c2c 0%, #10151f 45%, #0b0f17 100%);
    background-attachment:fixed;
    color:var(--ivory);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
  }
  header svg{flex-shrink:0; cursor:pointer;}
  header .htext{flex:1;}
  header h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.02em;
    margin:0;
    text-transform:uppercase;
  }
  header p{
    margin:2px 0 0;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.03em;
  }
  .logout-link{
    font-size:12px;
    color:var(--muted);
    background:none;
    border:1px solid var(--border);
    padding:6px 10px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .logout-link:hover{border-color:var(--brass); color:var(--ivory);}

  .mode-switch{
    display:flex;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:999px;
    padding:3px;
    margin-bottom:18px;
  }
  .mode-switch button{
    flex:1;
    border:none;
    background:transparent;
    color:var(--muted);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:9px 0;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .mode-switch button.active{
    background:var(--brass);
    color:#2b1e0c;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
    position:relative;
  }
  .lugs{
    display:flex;
    justify-content:space-between;
    padding:0 6px;
    margin-bottom:10px;
  }
  .lugs span{
    width:6px; height:6px; border-radius:50%;
    background:var(--brass-dark);
  }

  .section-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    color:var(--muted);
    margin:22px 0 10px;
  }
  .section-title:first-child{margin-top:0;}

  .row{display:flex; align-items:center; gap:10px;}
  .row + .row{margin-top:10px;}

  select, input[type=text], input[type=password], textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--ivory);
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:9px 10px;
    border-radius:8px;
    resize:vertical;
  }
  select:focus, input:focus, textarea:focus{
    outline:none;
    border-color:var(--brass);
  }
  input:disabled, select:disabled, textarea:disabled{
    opacity:0.75;
    cursor:default;
  }

  .icon-btn{
    flex-shrink:0;
    width:38px;
    height:38px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--brass);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:18px;
  }
  .icon-btn:hover{border-color:var(--brass);}

  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .month-nav .label{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:17px;
    text-transform:capitalize;
    letter-spacing:0.01em;
  }
  .month-nav button{
    width:34px; height:34px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--ivory);
    font-size:16px;
    cursor:pointer;
  }
  .month-nav button:hover{border-color:var(--brass);}

  .dial-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px 0 6px;
    position:relative;
  }
  .dial-wrap::before{
    content:"";
    position:absolute;
    width:150px; height:150px;
    border-radius:50%;
    background:
      repeating-radial-gradient(circle, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 6px);
    opacity:0.6;
    pointer-events:none;
  }
  .dial-caption{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    letter-spacing:0.04em;
    margin-top:-4px;
    margin-bottom:6px;
    text-transform:uppercase;
  }
  .totale-lezioni-caption{
    text-align:center;
    color:var(--brass);
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:12.5px;
    letter-spacing:0.02em;
    margin-bottom:14px;
  }

  .lesson-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-left:4px solid var(--muted);
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
    transition:border-color .15s ease;
  }
  .lesson-card.done{border-left-color:var(--green);}
  .lesson-card.pending{border-left-color:var(--red);}

  .lesson-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .lesson-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.02em;
    color:var(--muted);
    text-transform:uppercase;
  }

  .lesson-meta{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }
  .lesson-meta input{flex:1;}
  .fascia-label{
    font-size:12px;
    color:var(--brass);
    margin:0 0 8px;
    letter-spacing:0.02em;
  }

  .status-pill{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:600;
    padding:5px 11px;
    border-radius:999px;
    cursor:pointer;
    border:1px solid transparent;
    user-select:none;
  }
  .status-pill.done{background:var(--green-deep); color:#bfe6c6;}
  .status-pill.pending{background:var(--red-deep); color:#f2c6ba;}
  .status-pill:not(.clickable){cursor:default;}

<script type="module">
// ============================================================
// CONFIGURAZIONE FIREBASE — DA COMPILARE
// ============================================================
// 1) Vai su https://console.firebase.google.com, crea un progetto gratuito.
// 2) Nel progetto: "Crea app web" (icona </>), copia l'oggetto di
//    configurazione che ti viene mostrato e incollalo qui sotto al posto
//    dei valori "INSERISCI...".
// 3) Nella sezione "Build" del progetto attiva Firestore Database
//    (crea database, modalità "test" per iniziare). Non serve Storage:
//    i PDF allegati vengono salvati direttamente in Firestore.
// 4) IMPORTANTE (sicurezza): la modalità "test" rende il database
//    leggibile/scrivibile da chiunque conosca l'indirizzo, non solo da chi
//    usa l'app tramite l'interfaccia. Va bene per iniziare, ma leggi le
//    note sulle regole di sicurezza che trovi nella risposta della chat.
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, query, where, documentId, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDi61MVvhDNCTHbn8wCVzPfLKiYQt1NUoM",
  authDomain: "diario-lezioni.firebaseapp.com",
  projectId: "diario-lezioni",
  storageBucket: "diario-lezioni.firebasestorage.app",
  messagingSenderId: "71047095521",
  appId: "1:71047095521:web:95151555498466ac7383a0"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const COLLEZIONE = "diario_batteria";
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const MAX_TENTATIVI = 5;
const BLOCCO_MS = 5 * 60 * 1000;

let state = {
  mode: "genitore",
  teacherUnlocked: false,
  docenteRivelato: false,
  parentStudentId: null,
  studenti: [],
  profiloDocente: {nome:"", bio:"", comunicazioni:"", comunicazioniData:null},
  pinDocente: null,
  browseStudentId: null,
  year: null, month: null,
  lezioni: [null,null,null,null],
  progressi: [],
  pagamento: false,
  allegati: [null,null,null,null],
  comunicazioneStudente: {testo:"", data:null},
  strumento: "batteria",
  dipartimentiAttivi: false
};

// ---------- STRUMENTI (dipartimenti scuola di musica) ----------
// "batteria" è lo strumento di default e usa le stesse chiavi di sempre
// (senza prefisso), per restare compatibile con i dati già esistenti.
// Gli altri strumenti hanno dati completamente separati (ognuno con i
// propri studenti, lezioni, PIN docente, ecc.), tramite un prefisso nella
// chiave di archiviazione.
const STRUMENTI_DISPONIBILI = [
  {valore:"batteria", etichetta:"Batteria", icona:"🥁"},
  {valore:"chitarra", etichetta:"Chitarra", icona:"🎸"},
  {valore:"basso", etichetta:"Basso elettrico", icona:"🎸"},
  {valore:"pianoforte", etichetta:"Pianoforte", icona:"🎹"},
  {valore:"voce", etichetta:"Canto", icona:"🎤"},
  {valore:"sax", etichetta:"Sassofono", icona:"🎷"},
  {valore:"tromba", etichetta:"Tromba", icona:"🎺"},
  {valore:"violino", etichetta:"Violino", icona:"🎻"},
];
function nomeStrumento(valore){
  const s = STRUMENTI_DISPONIBILI.find(s=>s.valore===valore);
  return s ? s.etichetta : valore;
}
function iconaStrumento(valore){
  const s = STRUMENTI_DISPONIBILI.find(s=>s.valore===valore);
  return s ? s.icona : "🎵";
}
function chiavePerStrumento(strumento, base){
  return strumento === "batteria" ? base : (strumento + ":" + base);
}
function chiaveStrumento(base){
  return chiavePerStrumento(state.strumento, base);
}

function monthKey(y,m){ return y+"-"+String(m+1).padStart(2,"0"); }
function emptyLessons(){ return [0,1,2,3].map(()=>({argomento:"", fatta:false, giorno:"", ora:""})); }
function calcolaFasciaOraria(ora){
  if(!ora) return "";
  const parti = ora.split(":");
  const h = parseInt(parti[0], 10), m = parseInt(parti[1], 10);
  if(isNaN(h) || isNaN(m)) return "";
  let fine = h*60 + m + 60;
  const hf = Math.floor(fine/60) % 24;
  const mf = fine % 60;
  return ora + " – " + String(hf).padStart(2,"0") + ":" + String(mf).padStart(2,"0");
}
function formattaGiorno(giorno){
  if(!giorno) return "";
  const d = new Date(giorno + "T00:00:00");
  if(isNaN(d.getTime())) return "";
  const giorni = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
  return giorni[d.getDay()] + " " + d.getDate() + " " + MESI[d.getMonth()];
}
function generaCodice(){
  let c = "";
  for(let i=0;i<6;i++) c += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return c;
}
function iconDrumKey(){
  return `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="vertical-align:-3px; margin-right:2px;"><circle cx="6" cy="6" r="4.5" stroke="#35d0c4" stroke-width="1.6"/><line x1="9" y1="9" x2="14" y2="14" stroke="#35d0c4" stroke-width="1.6" stroke-linecap="round"/></svg>`;
}
function iconCymbal(){
  return `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="vertical-align:-3px; margin-right:2px;"><ellipse cx="8" cy="8" rx="7" ry="3" stroke="#35d0c4" stroke-width="1.4"/><line x1="8" y1="1" x2="8" y2="15" stroke="#35d0c4" stroke-width="1.4"/></svg>`;
}

let flashTimer;
function flashSaved(){
  const el = document.getElementById("save-indicator");
  if(!el) return;
  el.textContent = "Salvato";
  clearTimeout(flashTimer);
  flashTimer = setTimeout(()=>{ el.textContent=""; }, 1400);
}
function flashError(){
  const el = document.getElementById("save-indicator");
  if(el) el.textContent = "Salvataggio non riuscito, riprova";
}

function ritarda(ms){ return new Promise(res=>setTimeout(res, ms)); }

// Dati condivisi tra docente e studenti: salvati su Firestore (cloud).
async function loadShared(key, fallback){
  try{
    const snap = await getDoc(doc(db, COLLEZIONE, key));
    return snap.exists() && "v" in snap.data() ? snap.data().v : fallback;
  }catch(e){ return fallback; }
}
async function saveShared(key, value){
  for(let tentativo=0; tentativo<2; tentativo++){
    try{
      await setDoc(doc(db, COLLEZIONE, key), {v: value});
      return true;
    }catch(e){}
    if(tentativo===0) await ritarda(400);
  }
  return false;
}
async function deleteShared(key){
  try{ await deleteDoc(doc(db, COLLEZIONE, key)); return true; }
  catch(e){ return false; }
}
// Elimina tutti i documenti la cui chiave inizia con "prefisso" (usato per
// ripulire lezioni/mensilità/allegati di TUTTI i mesi di uno studente).
async function deleteSharedByPrefix(prefisso){
  try{
    const q = query(
      collection(db, COLLEZIONE),
      where(documentId(), ">=", prefisso),
      where(documentId(), "<", prefisso + "\uf8ff")
    );
    const snap = await getDocs(q);
    if(snap.empty) return true;
    const batch = writeBatch(db);
    snap.forEach(d=>batch.delete(d.ref));
    await batch.commit();
    return true;
  }catch(e){ return false; }
}

// Conta quante lezioni risultano "svolte" in TUTTI i mesi di uno studente
// (interroga tutti i documenti "lezioni:studentId:*" e somma i flag fatta).
async function contaLezioniSvolteTotali(studentId){
  if(!studentId) return 0;
  try{
    const prefisso = chiaveStrumento("lezioni:" + studentId + ":");
    const q = query(
      collection(db, COLLEZIONE),
      where(documentId(), ">=", prefisso),
      where(documentId(), "<", prefisso + "\uf8ff")
    );
    const snap = await getDocs(q);
    let totale = 0;
    snap.forEach(d=>{
      const lezioni = (d.data() && d.data().v) || [];
      lezioni.forEach(l=>{ if(l && l.fatta) totale++; });
    });
    return totale;
  }catch(e){ return 0; }
}

// Dati "solo su questo dispositivo" (sessione, tentativi PIN, ultima
// modalità aperta): salvati con localStorage del browser, non nel cloud.
const LS_PREFIX = "diario-batteria:";
function loadPersonal(key, fallback){
  try{
    const raw = localStorage.getItem(LS_PREFIX + key);
    return raw !== null ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function savePersonal(key, value){
  try{ localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); return true; }
  catch(e){ return false; }
}
function deletePersonal(key){
  try{ localStorage.removeItem(LS_PREFIX + key); }catch(e){}
}

async function loadPinDocente(){
  state.pinDocente = await loadShared(chiaveStrumento("pin-insegnante"), null);
}
async function loadProfiloDocente(){
  state.profiloDocente = await loadShared(chiaveStrumento("profilo-insegnante"), {nome:"", bio:"", comunicazioni:"", comunicazioniData:null});
}
async function saveProfiloDocente(){
  const ok = await saveShared(chiaveStrumento("profilo-insegnante"), state.profiloDocente);
  if(ok) flashSaved(); else flashError();
}
async function loadStudenti(){
  state.studenti = await loadShared(chiaveStrumento("studenti"), []);
}
async function saveStudenti(){
  const ok = await saveShared(chiaveStrumento("studenti"), state.studenti);
  if(ok) flashSaved(); else flashError();
}
async function loadLezioni(studentId){
  await flushLezioniSave();
  if(!studentId){ state.lezioni = emptyLessons(); return; }
  const key = chiaveStrumento("lezioni:" + studentId + ":" + monthKey(state.year, state.month));
  state.lezioni = await loadShared(key, emptyLessons());
}
async function saveLezioni(studentId){
  // salvataggio immediato (usato per il toggle "svolta/da svolgere" e per i pulsanti diretti)
  if(!studentId) return;
  const key = chiaveStrumento("lezioni:" + studentId + ":" + monthKey(state.year, state.month));
  const ok = await saveShared(key, state.lezioni);
  if(ok) flashSaved(); else flashError();
}

// Salvataggio "debounced" per i campi di testo/data/ora delle lezioni.
// Il contesto (studente, anno, mese, strumento, contenuto) viene
// fotografato al momento della modifica, cosi' se nel frattempo si cambia
// mese o studente il salvataggio va comunque a finire sulla chiave
// corretta e non si perde nulla.
let lezioniSaveTimer = null;
let lezioniSaveCtx = null;
function scheduleLezioniSave(studentId){
  lezioniSaveCtx = {studentId, strumento: state.strumento, year: state.year, month: state.month, lezioni: JSON.parse(JSON.stringify(state.lezioni))};
  clearTimeout(lezioniSaveTimer);
  lezioniSaveTimer = setTimeout(()=>{ flushLezioniSave(); }, 500);
}
async function flushLezioniSave(){
  clearTimeout(lezioniSaveTimer);
  lezioniSaveTimer = null;
  if(!lezioniSaveCtx) return;
  const {studentId, strumento, year, month, lezioni} = lezioniSaveCtx;
  lezioniSaveCtx = null;
  const key = chiavePerStrumento(strumento, "lezioni:" + studentId + ":" + monthKey(year, month));
  const ok = await saveShared(key, lezioni);
  if(ok) flashSaved(); else flashError();
}

async function loadProgressi(studentId){
  if(!studentId){ state.progressi = []; return; }
  state.progressi = await loadShared(chiaveStrumento("progressi:" + studentId), []);
}
async function saveProgressi(studentId){
  if(!studentId) return;
  const ok = await saveShared(chiaveStrumento("progressi:" + studentId), state.progressi);
  if(ok) flashSaved(); else flashError();
}

async function loadPagamento(studentId){
  if(!studentId){ state.pagamento = false; return; }
  const key = chiaveStrumento("pagamento:" + studentId + ":" + monthKey(state.year, state.month));
  state.pagamento = await loadShared(key, false);
}
async function savePagamento(studentId){
  if(!studentId) return;
  const key = chiaveStrumento("pagamento:" + studentId + ":" + monthKey(state.year, state.month));
  const ok = await saveShared(key, state.pagamento);
  if(ok) flashSaved(); else flashError();
}

// Messaggio dello studente al docente: uno per studente (non per mese),
// come le note di progresso.
async function loadComunicazioneStudente(studentId){
  if(!studentId){ state.comunicazioneStudente = {testo:"", data:null}; return; }
  state.comunicazioneStudente = await loadShared(chiaveStrumento("comunicazione-studente:" + studentId), {testo:"", data:null});
}

// Ogni lezione può avere fino a 4 PDF, salvati tutti insieme (come lista)
// direttamente nel database Firestore, in formato testo codificato
// (base64). Firestore accetta al massimo ~1 MB per documento, per questo
// la somma dei PDF di una singola lezione va tenuta sotto ~900 KB
// (vedi MAX_TOTALE_ALLEGATI_BYTES).
async function saveAllegatiLezione(studentId, idx, lista){
  if(!studentId) return;
  const key = chiaveStrumento("allegato:" + studentId + ":" + monthKey(state.year, state.month) + ":" + idx);
  const ok = lista.length === 0 ? await deleteShared(key) : await saveShared(key, lista);
  if(ok) flashSaved(); else flashError();
  return ok;
}

async function leggiTentativi(){
  return await loadPersonal("tentativi-pin", {count:0, lockUntil:0});
}
async function registraTentativoFallito(){
  const t = await leggiTentativi();
  t.count = (t.count||0) + 1;
  if(t.count >= MAX_TENTATIVI){
    t.lockUntil = Date.now() + BLOCCO_MS;
    t.count = 0;
  }
  await savePersonal("tentativi-pin", t);
  return t;
}
async function azzeraTentativi(){
  await savePersonal("tentativi-pin", {count:0, lockUntil:0});
}

function renderDialSVG(lezioni){
  const fatte = lezioni.filter(l=>l.fatta).length;
  const total = lezioni.length || 4;
  const cx=60, cy=60, r=44;
  const segColors = lezioni.map(l=> l.fatta ? "#3fcf8e" : "#ff6b6b");
  let segs = "";
  const gap = 0.10;
  for(let i=0;i<4;i++){
    const a0 = (i/4)*2*Math.PI - Math.PI/2 + gap;
    const a1 = ((i+1)/4)*2*Math.PI - Math.PI/2 - gap;
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    segs += `<path d="M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" stroke="${segColors[i]}" stroke-width="9" stroke-linecap="round" fill="none"/>`;
  }
  return `
  <svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="${fatte} lezioni su ${total} svolte">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1f2a40" stroke-width="9"/>
    <circle cx="${cx}" cy="${cy}" r="${r+7}" fill="none" stroke="#1f2a40" stroke-width="1" stroke-dasharray="1 7"/>
    ${segs}
    <text x="${cx}" y="${cy+2}" text-anchor="middle" dominant-baseline="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="22" fill="#eef3f8">${fatte}/${total}</text>
  </svg>`;
}

function getLezioniConOrario(){
  return state.lezioni
    .map((l, idx)=>({...l, idx}))
    .filter(l=>l.giorno && l.ora)
    .map(l=>({...l, inizio: new Date(l.giorno + "T" + l.ora + ":00")}))
    .filter(l=>!isNaN(l.inizio.getTime()));
}
function isDomani(data){
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const domani = new Date(oggi); domani.setDate(domani.getDate()+1);
  const d = new Date(data); d.setHours(0,0,0,0);
  return d.getTime() === domani.getTime();
}

// Notifiche del browser: funzionano solo se questa scheda resta aperta
// (nessun promemoria puo' arrivare ad app chiusa, essendo una pagina web
// senza un servizio in background). Serve solo da rinforzo ai banner sopra.
let notificheProgrammate = false;
function scheduleBrowserNotifications(){
  if(notificheProgrammate) return;
  if(!("Notification" in window)) return;
  if(Notification.permission === "default"){
    Notification.requestPermission();
  }
  if(Notification.permission !== "granted") return;
  notificheProgrammate = true;
  const now = new Date();
  getLezioniConOrario().forEach(l=>{
    const unOraPrima = new Date(l.inizio.getTime() - 60*60*1000);
    const giornoPrima = new Date(l.inizio); giornoPrima.setDate(giornoPrima.getDate()-1); giornoPrima.setHours(9,0,0,0);
    [
      {t: giornoPrima, testo: "Promemoria: hai lezione domani alle " + l.ora + "."},
      {t: unOraPrima, testo: "La tua lezione inizia tra un'ora, alle " + l.ora + "."}
    ].forEach(({t, testo})=>{
      const ritardo = t - now;
      if(ritardo > 0 && ritardo < 48*3600*1000){
        setTimeout(()=>{
          try{ new Notification("Diario lezioni batteria", {body: testo}); }catch(e){}
        }, ritardo);
      }
    });
  });
}

      <div class="row" style="margin-top:8px;">
        <select id="strumento-select">
          ${STRUMENTI_DISPONIBILI.map(s=>`<option value="${s.valore}" ${s.valore===state.strumento ? "selected" : ""}>${s.icona} ${s.etichetta}</option>`).join("")}
        </select>
      </div>
      ` : ""}
      <p style="margin-top:10px;">${creating
        ? "Imposta un PIN (almeno 4 caratteri) per proteggere l'accesso agli strumenti del docente. Servirà anche dagli altri dispositivi."
        : "Inserisci il PIN per gestire studenti, lezioni e progressi."}</p>
      <div class="row">
        <input type="password" id="pin-input" placeholder="PIN" inputmode="numeric">
      </div>
      <div class="row" style="margin-top:12px;">
        <button class="primary-btn" id="pin-submit">${creating ? "Crea PIN" : "Accedi"}</button>
      </div>
      <div id="pin-error"></div>
    </div>
  `;

  document.getElementById("dipartimenti-check").addEventListener("change", async (e)=>{
    state.dipartimentiAttivi = e.target.checked;
    if(!state.dipartimentiAttivi){
      state.strumento = "batteria";
      await loadPinDocente();
    }
    await saveShared("impostazioni-app", {dipartimentiAttivi: state.dipartimentiAttivi});
    await renderTeacherGate(container);
  });

  const strumentoSelect = document.getElementById("strumento-select");
  if(strumentoSelect){
    strumentoSelect.addEventListener("change", async ()=>{
      state.strumento = strumentoSelect.value;
      await loadPinDocente();
      await renderTeacherGate(container);
    });
  }

  document.getElementById("pin-submit").addEventListener("click", async ()=>{
    const val = document.getElementById("pin-input").value.trim();
    const errEl = document.getElementById("pin-error");
    if(creating){
      if(val.length < 4){
        errEl.innerHTML = '<p class="error-text">Il PIN deve avere almeno 4 caratteri.</p>';

      await saveShared(chiaveStrumento("pin-insegnante"), val);

      await loadProfiloDocente();
      state.teacherUnlocked = true;
      await azzeraTentativi();

// Cerca un codice studente. Se i dipartimenti strumento sono attivi,
// cerca in tutti gli strumenti (uno studente può appartenere a uno
// qualsiasi); altrimenti cerca solo nella lista già caricata (batteria).
async function trovaStudentePerCodice(codice){
  if(!state.dipartimentiAttivi){
    const trovato = state.studenti.find(s=>s.codice===codice);
    return trovato ? {strumento:"batteria", studenti: state.studenti, studente: trovato} : null;
  }
  for(const s of STRUMENTI_DISPONIBILI){
    const lista = await loadShared(chiavePerStrumento(s.valore, "studenti"), []);
    const trovato = lista.find(x=>x.codice===codice);
    if(trovato) return {strumento: s.valore, studenti: lista, studente: trovato};
  }
  return null;
}

function debounceSave(setter, saveFn){
  let t;
  return (e)=>{
    setter(e.target.value);
    clearTimeout(t);
    t = setTimeout(saveFn, 500);

}

// ---------- METRONOMO (utility condivisa, docente + studente) ----------
//
// Il tempo viene scandito con la tecnica dello "scheduler con lookahead":
// non affidiamo il ritmo a setInterval (impreciso e soggetto a irregolarità
// perché dipende da quando il browser decide di eseguire il codice), ma
// calcoliamo in anticipo gli istanti esatti dei click sull'orologio interno
// dell'AudioContext, che è molto più stabile. Un controllo frequente (ogni
// 25ms) si limita a mettere in coda i click dei prossimi 100ms.

let metronomoBpm = 100;
let metronomoBpmIniziale = 100; // il BPM impostato dall'utente all'avvio (o all'ultima modifica manuale)
let metronomoInPausa = true;
let metronomoSuddivisione = "quarti"; // quarti | crome | sedicesimi | sed24 | sed13 | terzine
let metronomoAudioCtx = null;
let metronomoLookaheadTimer = null;
let metronomoUiTimer = null;
let metronomoProssimoTempo = 0;
let metronomoIndiceSub = 0;
let metronomoPosizioneBeatInMisura = 0; // 0-3: 0 = primo battito della battuta (downbeat)
let metronomoAumentoOgniMisure = 0; // 0 = disattivato, altrimenti 4 oppure 8
let metronomoNumeroBattitoProssimo = 1; // numero (1-based) del PROSSIMO battito da programmare

const METRONOMO_LOOKAHEAD_MS = 25;
const METRONOMO_SCHEDULA_AVANTI_SEC = 0.1;
const METRONOMO_BATTITI_PER_BATTUTA = 4; // tempo 4/4

// Calcola il BPM che deve avere un dato battito (1-based), in modo diretto
// e senza alcuna ambiguità di ordine: il battito 1-16 usa il BPM iniziale,
// dal battito 17 in poi (con "ogni 4 battute") usa BPM+3, dal battito 33
// BPM+6, e così via — sempre un incremento netto e verificabile.
function metronomoBpmPerBattito(numeroBattito){
  if(metronomoAumentoOgniMisure <= 0) return metronomoBpmIniziale;
  const battitiPerAumento = metronomoAumentoOgniMisure * METRONOMO_BATTITI_PER_BATTUTA;
  const numeroAumenti = Math.floor((numeroBattito - 1) / battitiPerAumento);
  return Math.min(350, metronomoBpmIniziale + 3 * numeroAumenti);
}

function metronomoDefinisciSuddivisione(){
  switch(metronomoSuddivisione){
    case "crome":     return {subCount:2, posizioni:[0,1]};
    case "sedicesimi":return {subCount:4, posizioni:[0,1,2,3]};
    case "sed24":     return {subCount:4, posizioni:[1,3]};
    case "sed13":     return {subCount:4, posizioni:[0,2]};
    case "terzine":   return {subCount:3, posizioni:[0,1,2]};
    default:          return {subCount:1, posizioni:[0]}; // quarti
  }
}

// Click sintetizzato con un breve impulso di rumore filtrato (non un tono
// sinusoidale "beep"): suona più simile a un vero click di metronomo,
// secco e ben definito. Tre "livelli" di suono ben distinti:
// - "misura": il primo battito della battuta (il downbeat) — il più acuto
//   e forte, per riconoscere sempre a orecchio dove inizia ogni battuta.
// - "battito": gli altri battiti principali della battuta (2°, 3°, 4°).
// - "suddivisione": gli eventuali click interni al battito (crome, ecc).
function metronomoSuonaClick(livello, tempoAudio){
  const ctx = metronomoAudioCtx;
  const durata = 0.045;
  const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * durata));
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const dati = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){
    const decadimento = Math.pow(1 - i / bufferSize, 4);
    dati[i] = (Math.random() * 2 - 1) * decadimento;
  }
  const source = ctx.createBufferSource();
  source.buffer = buffer;

  let frequenza, volume;
  if(livello === "misura"){ frequenza = 2900; volume = 1.0; }
  else if(livello === "battito"){ frequenza = 2000; volume = 0.6; }
  else { frequenza = 1400; volume = 0.4; } // suddivisione

  const filtro = ctx.createBiquadFilter();
  filtro.type = "bandpass";
  filtro.frequency.value = frequenza;
  filtro.Q.value = 6;

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(volume, tempoAudio);
  gain.gain.exponentialRampToValueAtTime(0.001, tempoAudio + durata);

  source.connect(filtro);
  filtro.connect(gain);
  gain.connect(ctx.destination);
  source.start(tempoAudio);
}

function metronomoAvanzaNota(subCount){
  const nuovoIndice = (metronomoIndiceSub + 1) % subCount;
  if(nuovoIndice === 0){
    // si è appena concluso un intero "quarto" (un battito) — indipendente
    // dalla suddivisione scelta, questo è sempre il battito principale.
    // Il PROSSIMO battito da programmare è quindi il numero N seguente:
    // calcoliamo il suo BPM in modo diretto (non incrementale), così il
    // battito 17 (dopo 4 battute) e il 33 (dopo 8 battute) sono sempre e
    // solo loro i primi a suonare più veloci, senza nessuna ambiguità.
    metronomoNumeroBattitoProssimo++;
    metronomoPosizioneBeatInMisura = (metronomoPosizioneBeatInMisura + 1) % METRONOMO_BATTITI_PER_BATTUTA;
    metronomoBpm = metronomoBpmPerBattito(metronomoNumeroBattitoProssimo);
  }
  const secPerBeat = 60.0 / metronomoBpm;
  metronomoProssimoTempo += secPerBeat / subCount;
  metronomoIndiceSub = nuovoIndice;
}

function metronomoSchedulaEventi(){
  const {subCount, posizioni} = metronomoDefinisciSuddivisione();
  while(metronomoProssimoTempo < metronomoAudioCtx.currentTime + METRONOMO_SCHEDULA_AVANTI_SEC){
    if(posizioni.includes(metronomoIndiceSub)){
      let livello;
      if(metronomoIndiceSub === 0){
        livello = (metronomoPosizioneBeatInMisura === 0) ? "misura" : "battito";
      }else{
        livello = "suddivisione";
      }
      metronomoSuonaClick(livello, metronomoProssimoTempo);
    }
    metronomoAvanzaNota(subCount);
  }
}

// Aggiorna il numero/lo slider a schermo mentre il metronomo suona, così
// l'aumento automatico di BPM resta visibile anche se non si tocca nulla.
function metronomoAggiornaDisplay(){
  const bpmEl = document.getElementById("metronomo-bpm");
  const slider = document.getElementById("metronomo-slider");
  if(bpmEl) bpmEl.textContent = metronomoBpm;
  if(slider) slider.value = metronomoBpm;
}

function metronomoAvvia(){
  if(metronomoBpm <= 0) return;
  if(!metronomoAudioCtx) metronomoAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(metronomoAudioCtx.state === "suspended") metronomoAudioCtx.resume();
  metronomoInPausa = false;
  metronomoIndiceSub = 0;
  metronomoPosizioneBeatInMisura = 0;
  metronomoBpmIniziale = metronomoBpm; // il tempo attuale diventa il riferimento "battito 1"
  metronomoNumeroBattitoProssimo = 1;
  metronomoProssimoTempo = metronomoAudioCtx.currentTime + 0.05;
  clearInterval(metronomoLookaheadTimer);
  metronomoLookaheadTimer = setInterval(metronomoSchedulaEventi, METRONOMO_LOOKAHEAD_MS);
  clearInterval(metronomoUiTimer);
  metronomoUiTimer = setInterval(metronomoAggiornaDisplay, 300);
}
function metronomoFerma(){
  metronomoInPausa = true;
  clearInterval(metronomoLookaheadTimer);
  metronomoLookaheadTimer = null;
  clearInterval(metronomoUiTimer);
  metronomoUiTimer = null;
}
function metronomoImpostaBpm(nuovo){
  // Il BPM si applica dal prossimo battito già in coda: nessun bisogno di
  // fermare e riavviare il motore, quindi nessuno scatto o "singhiozzo"
  // nell'audio quando lo si regola mentre suona. Una modifica manuale
  // ridefinisce anche il riferimento per l'aumento automatico, come se il
  // conteggio delle battute ripartisse da qui.
  metronomoBpm = Math.max(0, Math.min(350, nuovo));
  metronomoBpmIniziale = metronomoBpm;
  metronomoNumeroBattitoProssimo = 1;
  if(!metronomoInPausa && metronomoBpm <= 0) metronomoFerma();
}
function metronomoImpostaSuddivisione(nuova){
  metronomoSuddivisione = nuova;
  metronomoIndiceSub = 0;
}
function metronomoImpostaAumento(nuovo){
  metronomoAumentoOgniMisure = parseInt(nuovo, 10) || 0;
  metronomoBpmIniziale = metronomoBpm;
  metronomoNumeroBattitoProssimo = 1;
}

function renderMetronomo(){
  const bpmEl = document.getElementById("metronomo-bpm");
  const slider = document.getElementById("metronomo-slider");
  const toggleBtn = document.getElementById("metronomo-toggle");
  const suddivisioneEl = document.getElementById("metronomo-suddivisione");
  const aumentoEl = document.getElementById("metronomo-aumento");
  const menoUnoBtn = document.getElementById("metronomo-meno1");
  const piuUnoBtn = document.getElementById("metronomo-piu1");
  if(!bpmEl || !slider || !toggleBtn) return;

  const aggiorna = ()=>{
    bpmEl.textContent = metronomoBpm;
    slider.value = metronomoBpm;
    toggleBtn.textContent = metronomoInPausa ? "▶ Avvia" : "⏸ Ferma";
    toggleBtn.className = "primary-btn" + (metronomoInPausa ? "" : " metronomo-attivo");
  };
  aggiorna();

  slider.addEventListener("input", ()=>{
    metronomoImpostaBpm(parseInt(slider.value, 10));
    aggiorna();
  });
  if(menoUnoBtn){
    menoUnoBtn.addEventListener("click", ()=>{
      metronomoImpostaBpm(metronomoBpm - 1);
      aggiorna();
    });
  }
  if(piuUnoBtn){
    piuUnoBtn.addEventListener("click", ()=>{
      metronomoImpostaBpm(metronomoBpm + 1);
      aggiorna();
    });
  }
  document.querySelectorAll(".metro-step").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const delta = parseInt(btn.getAttribute("data-delta"), 10);
      metronomoImpostaBpm(metronomoBpm + delta);
      aggiorna();
    });
  });
  if(suddivisioneEl){
    suddivisioneEl.addEventListener("change", ()=>{
      metronomoImpostaSuddivisione(suddivisioneEl.value);
    });
  }
  toggleBtn.addEventListener("click", ()=>{
    if(metronomoInPausa) metronomoAvvia(); else metronomoFerma();
    aggiorna();
  });
  if(aumentoEl){
    aumentoEl.addEventListener("change", ()=>{
      metronomoImpostaAumento(aumentoEl.value);
    });
  }
}

function renderStudentsList(){
  const el = document.getElementById("students-list");
  if(!el) return;
  if(state.studenti.length === 0){
    el.innerHTML = '<p class="hint">Nessuno studente ancora. Aggiungine uno qui sotto.</p>';
    return;
  }
  el.innerHTML = state.studenti.map(s=>`
    <div class="student-row">
      <span class="name">${esc(s.nome)}</span>
      <span class="code-chip">${esc(s.codice)}</span>
      <button class="drum-owned-btn" data-id="${s.id}" title="${s.haBatteria ? "Possiede una batteria — tocca per segnare che non ce l'ha" : "Non possiede una batteria — tocca per segnare che ce l'ha"}">${iconDrumKit(!!s.haBatteria)}</button>
      <button class="student-remove" data-id="${s.id}" title="Elimina studente">🗑</button>
    </div>
  `).join("");
  el.querySelectorAll(".drum-owned-btn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const id = btn.getAttribute("data-id");
      const s = state.studenti.find(x=>x.id===id);
      if(!s) return;
      s.haBatteria = !s.haBatteria;
      await saveStudenti();
      renderStudentsList();
    });
  });
  el.querySelectorAll(".student-remove").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const id = btn.getAttribute("data-id");
      await eliminaAllievo(id);
    });
  });
}

async function eliminaAllievo(studentId){
  const s = state.studenti.find(x=>x.id===studentId);
  if(!s) return;
  const conferma = confirm(
    "Eliminare definitivamente " + s.nome + "?\n\n" +
    "Verranno cancellati per sempre tutte le lezioni, le note di progresso, " +
    "gli allegati PDF e lo storico delle mensilità di questo studente. " +
    "L'operazione non è reversibile."
  );
  if(!conferma) return;

  await flushLezioniSave();
  state.studenti = state.studenti.filter(x=>x.id!==studentId);
  await saveStudenti();

  await deleteShared(chiaveStrumento("progressi:" + studentId));
  await deleteSharedByPrefix(chiaveStrumento("lezioni:" + studentId + ":"));
  await deleteSharedByPrefix(chiaveStrumento("pagamento:" + studentId + ":"));
  await deleteSharedByPrefix(chiaveStrumento("allegato:" + studentId + ":"));

  if(state.browseStudentId === studentId) state.browseStudentId = null;
  renderStudentsList();
  renderStudentSelectTeacher();
  await refreshStudentData();
}

function renderStudentSelectTeacher(){
  const sel = document.getElementById("student-select");
  if(!sel) return;
  sel.innerHTML = "";
  if(state.studenti.length === 0){
    const opt = document.createElement("option");
    opt.textContent = "Nessuno studente"; opt.value = "";
    sel.appendChild(opt);
    sel.disabled = true;
    state.browseStudentId = null;
    return;
  }
  sel.disabled = false;
  if(!state.browseStudentId || !state.studenti.find(s=>s.id===state.browseStudentId)){
    state.browseStudentId = state.studenti[0].id;
  }
  state.studenti.forEach(s=>{
    const opt = document.createElement("option");
    opt.value = s.id; opt.textContent = s.nome;
    if(s.id === state.browseStudentId) opt.selected = true;
    sel.appendChild(opt);
  });
}

async function refreshStudentData(){
  const id = state.mode === "insegnante" ? state.browseStudentId : state.parentStudentId;
  const lessonsEl = document.getElementById("lessons-container");
  if(lessonsEl && id) lessonsEl.innerHTML = `<div class="empty"><b>Caricamento…</b></div>`;
  try{
    await loadLezioni(id);
    await loadProgressi(id);
    await loadPagamento(id);
    await loadAllegati(id);
    await loadComunicazioneStudente(id);
  }catch(e){
    console.error("Errore refreshStudentData:", e);
    if(lessonsEl) lessonsEl.innerHTML = `<div class="empty"><b>Errore nel caricamento dei dati.</b><br>${esc(String(e && e.message || e))}</div>`;
    return;
  }
  const dialEl = document.getElementById("dial-wrap");
  if(dialEl) dialEl.innerHTML = renderDialSVG(state.lezioni);
  renderLessons(id);
  renderProgressList(state.mode === "insegnante");
  if(state.mode === "genitore") renderReminders(id);
  if(state.mode === "insegnante") renderComunicazioneStudente(id);
  try{
    await aggiornaContatoreLezioni(id);
  }catch(e){
    console.error("Errore aggiornaContatoreLezioni:", e);
  }
}

async function aggiornaContatoreLezioni(studentId){
  const el = document.getElementById("totale-lezioni");
  if(!el) return;
  if(!studentId){ el.textContent = ""; return; }
  const totale = await contaLezioniSvolteTotali(studentId);
  el.textContent = "🥁 Lezioni svolte in totale: " + totale;
}

}

const MAX_ALLEGATI_PER_LEZIONE = 4;
const MAX_TOTALE_ALLEGATI_BYTES = 900 * 1024; // ~900 KB totali per lezione (somma dei PDF in base64), sotto il limite di ~1MB per documento di Firestore

function renderLessons(studentId){
  const container = document.getElementById("lessons-container");
  if(!container) return;
  container.innerHTML = "";
  if(!studentId){
    container.innerHTML = `<div class="empty"><b>Nessuno studente selezionato.</b></div>`;
    return;
  }
  const editable = state.mode === "insegnante";
  state.lezioni.forEach((l, idx)=>{
    const card = document.createElement("div");
    card.className = "lesson-card " + (l.fatta ? "done" : "pending");
    const top = document.createElement("div");
    top.className = "lesson-top";
    const title = document.createElement("div");
    title.className = "lesson-title";
    title.textContent = "Lezione " + (idx+1);

    const right = document.createElement("div");
    right.className = "lesson-top-right";

    const coinBtn = document.createElement("button");
    const setCoinState = ()=>{
      const cliccabile = editable && !state.pagamento;
      coinBtn.className = "coin-btn " + (state.pagamento ? "paid" : "unpaid") + (cliccabile ? " clickable" : "");
      coinBtn.title = state.pagamento
        ? "Mensilità già segnata come pagata per questo mese — sbloccabile solo dal mese successivo"
        : (editable ? "Mensilità da pagare — tocca per segnare come pagata" : "Mensilità da pagare");
    };
    coinBtn.innerHTML = iconCoin();
    setCoinState();
    if(editable){
      coinBtn.addEventListener("click", async ()=>{
        if(state.pagamento) return; // già confermato: resta bloccato fino al mese successivo
        const conferma = confirm(
          "Confermi di voler segnare la mensilità di questo mese come pagata?\n\n" +
          "Una volta confermato il pulsante resterà bloccato per il resto del mese: " +
          "potrai sbloccarlo solo passando al mese successivo."
        );
        if(!conferma) return;
        state.pagamento = true;
        renderLessons(studentId);
        await savePagamento(studentId);
      });
    }
    right.appendChild(coinBtn);

    const pill = document.createElement("div");
    pill.className = "status-pill " + (l.fatta ? "done" : "pending") + (editable ? " clickable" : "");
    pill.innerHTML = `<span class="dot"></span><span>${l.fatta ? "Svolta" : "Da svolgere"}</span>`;
    if(editable){
      pill.addEventListener("click", async ()=>{
        if(!l.fatta){
          const conferma = confirm("Confermi che questa lezione è stata svolta?");
          if(!conferma) return;
          l.fatta = true;
        }else{
          l.fatta = false;
        }
        renderLessons(studentId);
        document.getElementById("dial-wrap").innerHTML = renderDialSVG(state.lezioni);
        await saveLezioni(studentId);
        await aggiornaContatoreLezioni(studentId);
      });
    }
    right.appendChild(pill);
    top.appendChild(title); top.appendChild(right);
    card.appendChild(top);

    if(editable){
      const meta = document.createElement("div");
      meta.className = "lesson-meta";
      const dateInput = document.createElement("input");
      dateInput.type = "date";
      dateInput.value = l.giorno || "";
      const timeInput = document.createElement("input");
      timeInput.type = "time";
      timeInput.value = l.ora || "";
      const saveMeta = ()=>{
        l.giorno = dateInput.value;
        l.ora = timeInput.value;
        scheduleLezioniSave(studentId);
        fasciaEl.textContent = calcolaFasciaOraria(l.ora) ? "Fascia oraria: " + calcolaFasciaOraria(l.ora) + " (1 ora)" : "";
      };
      dateInput.addEventListener("input", saveMeta);
      timeInput.addEventListener("input", saveMeta);
      meta.appendChild(dateInput);
      meta.appendChild(timeInput);
      card.appendChild(meta);

      var fasciaEl = document.createElement("p");
      fasciaEl.className = "fascia-label";
      fasciaEl.textContent = calcolaFasciaOraria(l.ora) ? "Fascia oraria: " + calcolaFasciaOraria(l.ora) + " (1 ora)" : "";
      card.appendChild(fasciaEl);
    }else if(l.giorno || l.ora){
      const fasciaEl = document.createElement("p");
      fasciaEl.className = "fascia-label";
      const giornoTxt = formattaGiorno(l.giorno);
      const fasciaTxt = calcolaFasciaOraria(l.ora);
      fasciaEl.textContent = [giornoTxt, fasciaTxt].filter(Boolean).join(" · ");
      if(fasciaEl.textContent) card.appendChild(fasciaEl);
    }

    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Argomento trattato (es. rullante, coordinazione, primo brano)";
    input.value = l.argomento || "";
    input.disabled = !editable;
    input.addEventListener("input", ()=>{
      l.argomento = input.value;
      scheduleLezioniSave(studentId);
    });
    card.appendChild(input);

    // ---- allegati PDF (fino a 4 per lezione) ----
    const pdfRow = document.createElement("div");
    pdfRow.className = "pdf-row";
    const renderPdfRow = ()=>{
      pdfRow.innerHTML = "";
      const lista = state.allegati[idx] || [];
      lista.forEach((allegato, allegatoIdx)=>{
        const chip = document.createElement("div");
        chip.className = "pdf-chip";
        const link = document.createElement("a");
        link.href = allegato.dati;
        link.download = allegato.nome || ("lezione-" + (allegatoIdx+1) + ".pdf");
        link.textContent = "📄 " + (allegato.nome || "lezione.pdf");
        chip.appendChild(link);
        if(editable){
          const rm = document.createElement("button");
          rm.className = "pdf-remove";
          rm.textContent = "✕";
          rm.title = "Rimuovi allegato";
          rm.addEventListener("click", async ()=>{
            const nuovaLista = state.allegati[idx].filter((_,i)=>i!==allegatoIdx);
            state.allegati[idx] = nuovaLista;
            renderPdfRow();
            await saveAllegatiLezione(studentId, idx, nuovaLista);
          });
          chip.appendChild(rm);
        }
        pdfRow.appendChild(chip);
      });
      if(editable && lista.length < MAX_ALLEGATI_PER_LEZIONE){
        const btn = document.createElement("button");
        btn.className = "icon-btn pdf-btn";
        btn.type = "button";
        btn.title = "Allega PDF della lezione (" + lista.length + "/" + MAX_ALLEGATI_PER_LEZIONE + ")";
        btn.textContent = "📎";
        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.accept = "application/pdf";
        fileInput.style.display = "none";
        btn.addEventListener("click", ()=>fileInput.click());
        fileInput.addEventListener("change", async ()=>{
          const file = fileInput.files && fileInput.files[0];
          fileInput.value = "";
          if(!file) return;
          if(file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")){
            flashError();
            return;
          }
          const listaAttuale = state.allegati[idx] || [];
          if(listaAttuale.length >= MAX_ALLEGATI_PER_LEZIONE){
            const el = document.getElementById("save-indicator");
            if(el) el.textContent = "Hai già " + MAX_ALLEGATI_PER_LEZIONE + " PDF su questa lezione, rimuovine uno prima di aggiungerne un altro";
            return;
          }
          const totaleAttuale = listaAttuale.reduce((tot,a)=>tot + (a.dimensione || 0), 0);
          if(totaleAttuale + file.size > MAX_TOTALE_ALLEGATI_BYTES){
            const el = document.getElementById("save-indicator");
            if(el) el.textContent = "I PDF di questa lezione supererebbero il limite totale, scegline uno più leggero o rimuovine uno";
            return;
          }
          const reader = new FileReader();
          reader.onload = async ()=>{
            const valore = {nome:file.name, dati:reader.result, dimensione:file.size};
            const nuovaLista = [...listaAttuale, valore];
            state.allegati[idx] = nuovaLista;
            renderPdfRow();
            await saveAllegatiLezione(studentId, idx, nuovaLista);
          };
          reader.readAsDataURL(file);
        });
        pdfRow.appendChild(btn);
        pdfRow.appendChild(fileInput);
      }
    };
    renderPdfRow();
    card.appendChild(pdfRow);

    container.appendChild(card);
  });
}

function renderProgressList(editable){
  const el = document.getElementById("progress-list");
  if(!el) return;
  if(state.progressi.length === 0){
    el.innerHTML = '<p class="hint">Ancora nessuna nota di progresso.</p>';
    return;
  }
  el.innerHTML = state.progressi.map(p=>`
    <div class="progress-item" data-id="${p.id}">
      ${editable ? `<button class="del" data-id="${p.id}">rimuovi</button>` : ""}
      <div class="date">${p.data}</div>
      <div class="text">${esc(p.testo)}</div>
    </div>
  `).join("");
  if(editable){
    el.querySelectorAll(".del").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const id = btn.getAttribute("data-id");
        state.progressi = state.progressi.filter(p=>p.id!==id);
        renderProgressList(true);
        await saveProgressi(state.browseStudentId);
      });
    });
  }
}

async function renderParentMain(container){
  const student = state.studenti.find(s=>s.id===state.parentStudentId);
  container.innerHTML = `
    ${state.strumento !== "batteria" ? `<div class="strumento-badge">${iconaStrumento(state.strumento)} ${nomeStrumento(state.strumento)}</div>` : ""}
    <div class="card">
      ${lugsRow()}
      <div class="empty" style="padding:6px 0 2px;">
        <b>${student ? esc(student.nome) : "Studente"}</b>
      </div>
    </div>

    <div id="comunicazione-container"></div>

    ${metronomoMarkup()}

    <div class="month-nav">
      <button id="btn-prev-month" aria-label="Mese precedente">‹</button>
      <div class="label" id="month-label"></div>
      <button id="btn-next-month" aria-label="Mese successivo">›</button>
    </div>

    <div id="reminders-container"></div>

    <div class="dial-wrap" id="dial-wrap"></div>
    <div class="dial-caption">lezioni svolte questo mese</div>
    <div class="totale-lezioni-caption" id="totale-lezioni"></div>

    <div class="section-title">${iconCymbal()}Lezioni del mese</div>
    <div id="lessons-container"></div>

    <div class="section-title">Note di progresso</div>
    <div class="card"><div id="progress-list"></div></div>

    <div class="section-title">Comunica con il tuo insegnante</div>
    <div class="card">
      <div class="row">
        <textarea id="msg-studente" placeholder="Scrivi qui un messaggio per il tuo insegnante (es. un dubbio o altre informazioni...)" rows="3">${esc(state.comunicazioneStudente.testo)}</textarea>
      </div>
      <p class="hint">Il tuo insegnante vedrà questo messaggio nel suo profilo.</p>
    </div>

    <p class="hint">Modalità studente: qui puoi consultare gli argomenti trattati, lo stato delle lezioni e le note di progresso.</p>
  `;
  renderMonthLabel();
  await refreshStudentData();
  renderComunicazione();
  renderMetronomo();
  scheduleBrowserNotifications();

  document.getElementById("msg-studente").addEventListener("input", debounceSave(v=>{
    state.comunicazioneStudente.testo = v;
    state.comunicazioneStudente.data = new Date().toISOString();
  }, ()=>saveComunicazioneStudente(state.parentStudentId)));

  document.getElementById("btn-prev-month").addEventListener("click", async ()=>{
    state.month--; if(state.month<0){state.month=11; state.year--;}
    renderMonthLabel();
    await refreshStudentData();
  });
  document.getElementById("btn-next-month").addEventListener("click", async ()=>{
    state.month++; if(state.month>11){state.month=0; state.year++;}
    renderMonthLabel();
    await refreshStudentData();
  });
}

function renderMonthLabel(){
  const el = document.getElementById("month-label");
  if(el) el.textContent = MESI[state.month] + " " + state.year;
}

// ---------- ROOT RENDER ----------

function renderShell(){
  const wrap = document.getElementById("mode-switch-wrap");
  const puoVedereDocente = state.teacherUnlocked || state.docenteRivelato;

  if(!puoVedereDocente){
    // Solo la modalità studente è visibile: nessun accesso al PIN docente in vista.
    wrap.innerHTML = "";
    state.mode = "genitore";
    document.getElementById("btn-logout").style.display = state.parentStudentId ? "inline-block" : "none";
    return;
  }

  wrap.innerHTML = `
    <div class="mode-switch">
      <button id="btn-mode-genitore">Studente</button>
      <button id="btn-mode-insegnante">Docente</button>
    </div>
  `;
  document.getElementById("btn-mode-genitore").className = state.mode === "genitore" ? "active" : "";
  document.getElementById("btn-mode-insegnante").className = state.mode === "insegnante" ? "active" : "";
  document.getElementById("btn-mode-genitore").addEventListener("click", async ()=>{
    await flushLezioniSave();
    state.mode = "genitore";
    state.teacherUnlocked = false; // uscendo dalla modalità docente si richiude sempre
    renderShell();
    await renderMain();
  });
  document.getElementById("btn-mode-insegnante").addEventListener("click", async ()=>{
    await flushLezioniSave();
    state.mode = "insegnante";
    state.teacherUnlocked = false; // il PIN va sempre reinserito ad ogni cambio modalità
    renderShell();
    await renderMain();
  });

  const unlocked = state.mode === "insegnante" ? state.teacherUnlocked : !!state.parentStudentId;
  document.getElementById("btn-logout").style.display = unlocked ? "inline-block" : "none";
}

async function renderMain(){
  const container = document.getElementById("app-body");
  if(state.mode === "insegnante"){
    if(!state.teacherUnlocked){ await renderTeacherGate(container); return; }
    await renderTeacherMain(container);
  }else{
    if(!state.parentStudentId){ renderParentGate(container); return; }
    await renderParentMain(container);
  }
}

// gesto segreto: 5 tocchi sull'icona dell'header in 4 secondi rivelano l'accesso docente
let tapTimes = [];
function setupSecretTap(){
  document.getElementById("header-icon").addEventListener("click", async ()=>{
    const now = Date.now();
    tapTimes.push(now);
    tapTimes = tapTimes.filter(t => now - t < 4000);
    if(tapTimes.length >= 5){
      tapTimes = [];
      if(!state.docenteRivelato){
        state.docenteRivelato = true;
        state.mode = "insegnante";
        renderShell();
        await renderMain();
      }
    }
  });
}

async function init(){
  const now = new Date();
  state.year = now.getFullYear();
  state.month = now.getMonth();

  const impostazioni = await loadShared("impostazioni-app", {dipartimentiAttivi: false});
  state.dipartimentiAttivi = !!(impostazioni && impostazioni.dipartimentiAttivi);

  await loadPinDocente();
  await loadProfiloDocente();
  await loadStudenti();

  // La modalità Docente parte sempre "chiusa": il PIN va reinserito ad ogni
  // apertura dell'app e ad ogni cambio modalità, non viene mai ricordato.
  state.teacherUnlocked = false;
  const sessioneGenitore = await loadPersonal("sessione-genitore", null);
  if(sessioneGenitore){
    if(sessioneGenitore.strumento && sessioneGenitore.strumento !== state.strumento){
      state.strumento = sessioneGenitore.strumento;
      await loadStudenti(); // ricarica la lista studenti per lo strumento corretto
    }
    if(state.studenti.find(s=>s.id===sessioneGenitore.studentId && s.codice===sessioneGenitore.codice)){
      state.parentStudentId = sessioneGenitore.studentId;
    }
  }

  state.mode = "genitore";

  setupSecretTap();

  document.getElementById("btn-logout").addEventListener("click", async ()=>{
    await flushLezioniSave();
    if(state.mode === "insegnante"){
      state.teacherUnlocked = false;
      state.docenteRivelato = false;
      state.mode = "genitore";
      if(state.strumento !== "batteria"){
        state.strumento = "batteria";
        await loadPinDocente();
        await loadStudenti();
        await loadProfiloDocente();
      }
    }else{
      state.parentStudentId = null;
      state.strumento = "batteria";
      await deletePersonal("sessione-genitore");
    }
    renderShell();
    await renderMain();
  });

  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "hidden") flushLezioniSave();
  });
  window.addEventListener("beforeunload", ()=>{ flushLezioniSave(); });

  renderShell();
  await renderMain();
}

init();
</script>
